<span class="cm-stars" aria-label="{{ filled }} out of 5 stars">
  {% for i in "12345" %}
    {% if forloop.counter <= filled %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#e59838" stroke="#e59838" stroke-width="1.5">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    {% else %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e59838" stroke-width="1.8">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    {% endif %}
  {% endfor %}
</span>
