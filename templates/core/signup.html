{% extends "base.html" %}
{% load static %}

{% block title %}Sign Up — CareMate{% endblock %}

{% block content %}
<section class="cm-auth-bg" style="background-image: url('{% static 'images/auth_bg.jpg' %}');">
  <div class="cm-auth-card">
    <h1 class="cm-auth-title">Sign Up</h1>
    <p class="cm-auth-sub">Already a member? <a href="{% url 'login' %}">Login.</a></p>

    {% if error %}
      <div class="cm-toast cm-toast-error" style="margin-bottom: 14px;">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="cm-field">
        <label class="cm-field-label" for="id_role">Role</label>
        <div class="cm-input-wrap">
          <span class="cm-input-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <select id="id_role" name="role" required>
            <option value="" disabled {% if not form_data.role %}selected{% endif %}>Select Role</option>
            <option value="patient" {% if form_data.role == 'patient' %}selected{% endif %}>Patient</option>
            <option value="doctor" {% if form_data.role == 'doctor' %}selected{% endif %}>Doctor</option>
          </select>
        </div>
      </div>

      <div class="cm-field">
        <label class="cm-field-label" for="id_name">Name</label>
        <div class="cm-input-wrap">
          <span class="cm-input-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="6" y1="10" x2="10" y2="10"/>
              <line x1="6" y1="14" x2="14" y2="14"/>
            </svg>
          </span>
          <input type="text" id="id_name" name="name" value="{{ form_data.name }}" placeholder="Enter your name" required />
        </div>
      </div>

      <div class="cm-field">
        <label class="cm-field-label" for="id_phone">Phone</label>
        <div class="cm-input-wrap">
          <span class="cm-input-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <input type="tel" id="id_phone" name="phone" value="{{ form_data.phone }}" placeholder="Enter your phone number" />
        </div>
      </div>

      <div class="cm-field">
        <label class="cm-field-label" for="id_email">Email</label>
        <div class="cm-input-wrap">
          <span class="cm-input-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="4"/>
              <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>
            </svg>
          </span>
          <input type="email" id="id_email" name="email" value="{{ form_data.email }}" placeholder="Enter your email address" required />
        </div>
      </div>

      <div class="cm-field">
        <label class="cm-field-label" for="id_signup_password">Password</label>
        <div class="cm-input-wrap">
          <span class="cm-input-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="id_signup_password" name="password" placeholder="••••••••" required />
          <button type="button" class="cm-eye-btn" onclick="togglePassword('id_signup_password')" aria-label="Toggle password visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="cm-auth-actions">
        <button type="submit" class="cm-btn-primary">Submit</button>
        <button type="reset" class="cm-btn-tan">Reset</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}

{% block footer %}{% endblock %}

{% block scripts %}
<script>
function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
